name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  # Manual run from any branch: builds and pushes the image tagged with the branch name
  workflow_dispatch:

env:
  IMAGE: ghcr.io/dodert/game-library-manager

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: pytest -q

  docker:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # SemVer: main builds are the release version from app/__init__.py (e.g. 0.5.0);
      # any other branch gets a pre-release of it, X.Y.Z-<branch>.<run> (e.g. 0.5.0-feat-bulk-scrape.27),
      # which sorts below the release and never takes a main version number
      - id: app
        run: |
          base=$(sed -n 's/^__version__ = "\(.*\)"/\1/p' app/__init__.py)
          if [ "${{ github.ref_name }}" = "${{ github.event.repository.default_branch }}" ] || [ "${{ github.ref_type }}" = "tag" ]; then
            version=$base
          else
            slug=$(echo "${{ github.ref_name }}" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9-]/-/g')
            version=$base-$slug.${{ github.run_number }}
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "minor=$(echo "$base" | cut -d. -f1,2)" >> "$GITHUB_OUTPUT"
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=${{ steps.app.outputs.version }},enable={{is_default_branch}}
            type=raw,value=${{ steps.app.outputs.minor }},enable={{is_default_branch}}
            type=ref,event=branch,enable=${{ github.event_name == 'workflow_dispatch' }}
            type=raw,value=pre-release,enable=${{ github.event_name == 'workflow_dispatch' && github.ref_name != github.event.repository.default_branch }}
            type=raw,value=${{ steps.app.outputs.version }},enable=${{ github.event_name == 'workflow_dispatch' && github.ref_name != github.event.repository.default_branch }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.app.outputs.version }}
            GIT_SHA=${{ github.sha }}
            GIT_REF=${{ github.ref_name }}
            BUILD_DATE=${{ fromJSON(steps.meta.outputs.json).labels['org.opencontainers.image.created'] }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
