<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Game Library Manager</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header>
    <h1>🎮 Mi biblioteca</h1>
    <div id="stats"></div>
    <button id="steam-import-btn" hidden>Importar Steam</button>
    <button id="add-btn">+ Añadir juego</button>
  </header>

  <section class="filters">
    <input id="q" type="search" placeholder="Buscar título, código de barras…">
    <select id="f-platform"><option value="">Todas las plataformas</option></select>
    <select id="f-format">
      <option value="">Físico y digital</option>
      <option value="physical">Físico</option>
      <option value="digital">Digital</option>
    </select>
    <select id="f-status">
      <option value="">Cualquier estado</option>
      <option value="owned">En colección</option>
      <option value="wishlist">Wishlist</option>
      <option value="lent">Prestado</option>
      <option value="sold">Vendido</option>
    </select>
    <select id="sort">
      <option value="title">Título A-Z</option>
      <option value="-title">Título Z-A</option>
      <option value="-created_at">Añadidos recientemente</option>
      <option value="-release_year">Año (nuevo primero)</option>
    </select>
  </section>

  <main id="grid" class="grid"></main>
  <p id="empty" hidden>No hay juegos todavía.</p>

  <dialog id="dlg">
    <form id="game-form" method="dialog">
      <h2 id="dlg-title">Añadir juego</h2>
      <input type="hidden" name="id">
      <input type="hidden" name="steam_appid">
      <div class="row title-row">
        <label>Título <input name="title" required></label>
        <button type="button" id="lookup-btn">Buscar en internet</button>
      </div>
      <div id="lookup" hidden>
        <div id="lookup-status"></div>
        <div id="lookup-results"></div>
      </div>
      <div id="cover-preview" hidden><img alt=""><span></span></div>
      <label>Plataforma <select name="platform_id" required></select></label>
      <div class="row">
        <label>Formato
          <select name="format">
            <option value="physical">Físico</option>
            <option value="digital">Digital</option>
          </select>
        </label>
        <label>Estado
          <select name="status">
            <option value="owned">En colección</option>
            <option value="wishlist">Wishlist</option>
            <option value="lent">Prestado</option>
            <option value="sold">Vendido</option>
          </select>
        </label>
        <label>Progreso
          <select name="completion">
            <option value="unplayed">Sin jugar</option>
            <option value="playing">Jugando</option>
            <option value="completed">Completado</option>
            <option value="abandoned">Abandonado</option>
          </select>
        </label>
      </div>
      <div class="row">
        <label>Tienda / launcher <input name="store" placeholder="Steam, PSN, eShop, GOG…"></label>
        <label>Edición <input name="edition"></label>
        <label>Región <input name="region" placeholder="PAL, NTSC-U…"></label>
      </div>
      <div class="row">
        <label>Código de barras <input name="barcode"></label>
        <label>Año <input name="release_year" type="number" min="1950" max="2100"></label>
      </div>
      <div class="row">
        <label>Fecha compra <input name="purchase_date" type="date"></label>
        <label>Precio <input name="purchase_price" type="number" step="0.01" min="0"></label>
      </div>
      <label>Descripción <textarea name="summary" rows="3"></textarea></label>
      <label>Notas <textarea name="notes" rows="2"></textarea></label>
      <label>Carátula <input name="cover" type="file" accept="image/jpeg,image/png,image/webp"></label>
      <menu>
        <button type="button" id="delete-btn" class="danger" hidden>Eliminar</button>
        <span class="spacer"></span>
        <button type="button" id="cancel-btn">Cancelar</button>
        <button type="submit" class="primary">Guardar</button>
      </menu>
    </form>
  </dialog>

  <script src="/static/app.js"></script>
</body>
</html>
