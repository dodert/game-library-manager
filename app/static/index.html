<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Game Library Manager</title>
  <link rel="stylesheet" href="/static/style.css?v={{ASSET_VERSION}}">
</head>
<body>
  <header>
    <h1>🎮 Mi biblioteca</h1>
    <div id="stats"></div>
    <button id="csv-import-btn">Importar CSV</button>
    <a id="csv-export-btn" class="button" href="/api/export/csv" download>Exportar CSV</a>
    <input id="csv-file" type="file" accept=".csv,text/csv" hidden>
    <button id="steam-import-btn" hidden>Importar Steam</button>
    <button id="scrape-btn">Buscar carátulas</button>
    <button id="add-btn">+ Añadir juego</button>
  </header>

  <div id="scrape-bar" hidden>
    <div class="scrape-text"></div>
    <progress max="1" value="0"></progress>
    <button type="button" id="scrape-cancel">Cancelar</button>
    <button type="button" id="scrape-close" hidden>Cerrar</button>
  </div>

  <dialog id="scrape-dlg">
    <form method="dialog" id="scrape-form">
      <h2>Buscar carátulas y datos</h2>
      <p class="hint" id="scrape-providers"></p>
      <label class="radio"><input type="radio" name="mode" value="missing" checked> <span id="scrape-missing-label">Solo los que nunca se han buscado</span></label>
      <label class="radio"><input type="radio" name="mode" value="all"> <span id="scrape-all-label">Todos</span></label>
      <p class="hint">Con «Todos» se reemplazan las carátulas que ya tengas. La descripción y el año solo se rellenan si están vacíos.</p>
      <menu>
        <span class="spacer"></span>
        <button type="button" id="scrape-dlg-cancel">Cancelar</button>
        <button type="submit" class="primary">Empezar</button>
      </menu>
    </form>
  </dialog>

  <nav class="tabs" role="tablist">
    <button role="tab" data-tab="collection" aria-selected="true">Colección</button>
    <button role="tab" data-tab="wishlist" aria-selected="false">Wishlist</button>
    <button role="tab" data-tab="lent" aria-selected="false">Prestados</button>
    <button role="tab" data-tab="sold" aria-selected="false">Vendidos</button>
    <button role="tab" data-tab="stats" aria-selected="false">Estadísticas</button>
  </nav>

  <section class="filters" id="filters">
    <input id="q" type="search" placeholder="Buscar título, código de barras…">
    <select id="f-platform"><option value="">Todas las plataformas</option></select>
    <select id="f-format">
      <option value="">Físico y digital</option>
      <option value="physical">Físico</option>
      <option value="digital">Digital</option>
    </select>
    <select id="sort">
      <option value="title">Título A-Z</option>
      <option value="-title">Título Z-A</option>
      <option value="-created_at">Añadidos recientemente</option>
      <option value="-release_year">Año (nuevo primero)</option>
    </select>
  </section>

  <main id="grid" class="grid"></main>
  <p id="empty" hidden>No hay juegos aquí todavía.</p>
  <section id="stats-view" hidden></section>

  <dialog id="dlg">
    <form id="game-form" method="dialog">
      <h2 id="dlg-title">Añadir juego</h2>
      <input type="hidden" name="id">
      <input type="hidden" name="steam_appid">
      <div class="row title-row">
        <label>Título <input name="title" required></label>
        <button type="button" id="lookup-btn">Buscar en internet</button>
      </div>
      <div id="lookup" hidden>
        <div id="lookup-status"></div>
        <div id="lookup-results"></div>
      </div>
      <div id="cover-preview" hidden><img alt=""><span></span></div>
      <nav class="tabs dlg-tabs" role="tablist">
        <button type="button" role="tab" data-pane="general" aria-selected="true">General</button>
        <button type="button" role="tab" data-pane="details" aria-selected="false">Detalles</button>
        <button type="button" role="tab" data-pane="collection" aria-selected="false">Colección</button>
        <button type="button" role="tab" data-pane="personal" aria-selected="false">Personal</button>
      </nav>

      <div class="pane" data-pane="general">
        <label>Plataforma <select name="platform_id" required></select></label>
        <div class="row">
          <label>Formato
            <select name="format">
              <option value="physical">Físico</option>
              <option value="digital">Digital</option>
            </select>
          </label>
          <label>Estado
            <select name="status">
              <option value="owned">En colección</option>
              <option value="wishlist">Wishlist</option>
              <option value="lent">Prestado</option>
              <option value="sold">Vendido</option>
            </select>
          </label>
          <label>Tipo de artículo <input name="item_type" list="item-types" placeholder="Juego"></label>
        </div>
        <div class="row">
          <label>Tienda / launcher <input name="store" placeholder="Steam, PSN, eShop, GOG…"></label>
          <label>Año <input name="release_year" type="number" min="1950" max="2100"></label>
        </div>
        <label>Descripción <textarea name="summary" rows="3"></textarea></label>
        <label>Carátula <input name="cover" type="file" accept="image/jpeg,image/png,image/webp"></label>
        <p class="hint" id="scrape-info"></p>
      </div>

      <div class="pane" data-pane="details" hidden>
        <div class="row">
          <label>Editor <input name="publisher"></label>
          <label>Desarrollador <input name="developer"></label>
        </div>
        <div class="row">
          <label>Género <input name="genre"></label>
          <label>Serie / saga <input name="series"></label>
        </div>
        <div class="row">
          <label>Edición <input name="edition"></label>
          <label>Región <input name="region" placeholder="PAL, NTSC-U…"></label>
        </div>
        <div class="row">
          <label>Código de barras <input name="barcode"></label>
          <label>Nº de serie <input name="serial_number"></label>
        </div>
      </div>

      <div class="pane" data-pane="collection" hidden>
        <div class="row">
          <label>Fecha compra <input name="purchase_date" type="date"></label>
          <label>Precio compra <input name="purchase_price" type="number" step="0.01" min="0" data-type="number"></label>
          <label>Valor actual <input name="current_value" type="number" step="0.01" min="0" data-type="number"></label>
        </div>
        <div class="row">
          <label>Completitud <input name="completeness" list="completeness-list" placeholder="CIB, New, Loose…"></label>
          <label>Condición <input name="condition"></label>
          <label>Cantidad <input name="quantity" type="number" min="0" data-type="number"></label>
        </div>
        <div class="row">
        <label>Caja
          <select name="has_box" data-type="bool"><option value="">—</option><option value="true">Sí</option><option value="false">No</option></select>
        </label>
        <label>Manual
          <select name="has_manual" data-type="bool"><option value="">—</option><option value="true">Sí</option><option value="false">No</option></select>
        </label>
          <label>Propietario <input name="owner"></label>
        </div>
        <div class="row">
          <label>Ubicación <input name="location"></label>
          <label>Almacenamiento <input name="storage_device"></label>
          <label>Hueco <input name="storage_slot"></label>
        </div>
      </div>

      <div class="pane" data-pane="personal" hidden>
        <div class="row">
          <label>Progreso
            <select name="completion">
              <option value="unplayed">Sin jugar</option>
              <option value="playing">Jugando</option>
              <option value="completed">Completado</option>
              <option value="abandoned">Abandonado</option>
            </select>
          </label>
          <label>Fecha completado <input name="completed_at" type="date"></label>
          <label>Puntuación (0-10) <input name="rating" type="number" min="0" max="10" data-type="number"></label>
        </div>
        <label>Etiquetas <input name="tags" placeholder="separadas por comas"></label>
        <div class="row">
          <label>Prestado a <input name="loaned_to"></label>
          <label>Fecha préstamo <input name="loaned_at" type="date"></label>
          <label>Devolución <input name="loan_due" type="date"></label>
        </div>
        <label>Notas <textarea name="notes" rows="3"></textarea></label>
      </div>
      <datalist id="item-types"><option value="Console"><option value="Controller"><option value="Accessory"><option value="Amiibo"></datalist>
      <datalist id="completeness-list"><option value="CIB"><option value="New"><option value="Loose"><option value="Box only"></datalist>
      <menu>
        <button type="button" id="delete-btn" class="danger" hidden>Eliminar</button>
        <span class="spacer"></span>
        <button type="button" id="cancel-btn">Cancelar</button>
        <button type="submit" class="primary">Guardar</button>
      </menu>
    </form>
  </dialog>

  <footer id="about"></footer>

  <script src="/static/app.js?v={{ASSET_VERSION}}"></script>
</body>
</html>
